name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, integration and refutation tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Release hygiene (versions, pinned actions, links, secrets, personal data, language)
        run: python tools/prepublish_check.py
      - name: Fixture oracles (trusted bundled corpus only)
        run: |
          python -m rbs verify-fixtures
          python -m rbs verify-fixtures --corpus fixtures-v2
      - name: Guided scripted demo
        run: python -m rbs quickstart --json
      - name: Agent skill walkthrough
        run: python tools/demo_codex_skill.py
      - name: Recompute every published run report from its raw records
        run: |
          python tools/reproduce_reports.py
          python tools/analyze_run.py --run results/pilot-2026-11-10/run
      - name: Editable install exposes the rbs command
        run: |
          python -m pip install --disable-pip-version-check -e .
          rbs --version
