[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "review-blindspot"
dynamic = ["version"]
description = "Measure when AI code-review protocols miss the same defects, and keep agent reviews evidence-backed and fresh."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Review Blind Spot contributors" }]
keywords = ["code-review", "llm-evaluation", "ai-agents", "agent-skills", "codex", "claude-code", "ollama", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Venorium/review-blindspot"
Issues = "https://github.com/Venorium/review-blindspot/issues"
Changelog = "https://github.com/Venorium/review-blindspot/blob/main/CHANGELOG.md"

[project.scripts]
rbs = "rbs.cli:entry"

[tool.setuptools]
packages = ["rbs"]

[tool.setuptools.dynamic]
version = { attr = "rbs.__version__" }
